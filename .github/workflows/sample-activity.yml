# Sample activity (docs/sample-activity.md). Arthur's ruling of 2026-11-04:
# permanent until he says otherwise, generated by this workflow, with the
# service key and the seed held as secrets.
#
# The secrets belong to the GitHub environment `sample-activity`, whose
# deployment branches are limited to main, not to the repository: a
# repository secret can be read by a workflow on any branch pushed here,
# and branches are pushed here routinely. A job on another branch that
# names this environment is refused before it starts.
#
# Runs only on its schedule and by hand from the Actions tab, never on a
# push or a pull request, so no fork can reach the secrets. The log is
# public: scripts/seed-ci.ts prints counts and check names only, and keeps
# the full report in seed_runs.last_report.
#
# Every six hours rather than weekly: a sample row is never dated in the
# future, and the school table shows only the current week, so a weekly
# run would leave the week's table without sample activity until the next
# run. Each run adds the activity since the last one.
#
# Modes, by hand: canary (starts the run, first 40 accounts), full (the
# rest), extend (what the schedule runs; it does nothing until a full
# stage has passed, or after teardown), and teardown, run only on Arthur's
# instruction and only with the run's id typed into confirm_teardown.
name: Sample activity

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "canary, full, extend, or teardown (Arthur's instruction only)"
        required: true
        default: extend
        type: choice
        options: [canary, full, extend, teardown]
      confirm_teardown:
        description: "Teardown only: the run's id, typed exactly"
        required: false
        default: ""
        type: string

permissions:
  contents: read

# One at a time, and a queued run waits rather than cancelling a live one.
concurrency:
  group: sample-activity
  cancel-in-progress: false

jobs:
  run:
    if: github.repository == 'Arthrzhng/Sophecs' && github.ref == 'refs/heads/main'
    environment: sample-activity
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The credentials file the seed tooling reads (scripts/seed/env.ts),
      # written with owner-only permissions and removed at the end. Nothing
      # is echoed; GitHub masks both secrets in the log.
      - name: Write the credentials file
        env:
          SERVICE_KEY: ${{ secrets.SEED_SUPABASE_SERVICE_ROLE_KEY }}
          PLAN_SEED: ${{ secrets.SEED_PLAN_SEED }}
        run: |
          umask 077
          {
            printf 'SEED_SUPABASE_URL=https://tekifezydjlgxgndkxul.supabase.co\n'
            printf 'SEED_SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SERVICE_KEY"
            printf 'SEED_PLAN_SEED=%s\n' "$PLAN_SEED"
          } > .env.seed.production
      - name: Sample activity
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'extend' }}
          CONFIRM_TEARDOWN: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_teardown || '' }}
        run: npm run -s seed:ci -- --mode "$MODE" --expected-project-ref tekifezydjlgxgndkxul --confirm-production tekifezydjlgxgndkxul --confirm-teardown "$CONFIRM_TEARDOWN"
      - name: Remove the credentials file
        if: always()
        run: rm -f .env.seed.production
